name: cipher-lab
x-runtime: &runtime
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: "5m"
      max-file: "2"

services:
  web:
    <<: *runtime
    build:
      context: .
      target: web
    # Measured runtime peak is ~300 MB; this leaves headroom without
    # over-committing a 1 GB host.
    mem_limit: 448m
    memswap_limit: 448m
    pids_limit: 128
    # Killed after lab containers but before nothing else important.
    oom_score_adj: -500
    environment:
      # Internal API for lab builds and homework grading (never public).
      GATEWAY_INTERNAL_URL: http://gateway:3002
      GRADER_INTERNAL_TOKEN: ${GRADER_INTERNAL_TOKEN:?Set GRADER_INTERNAL_TOKEN in .env}
      DATABASE_PATH: /app/data/cyberbox.sqlite
      CYBERBOX_LAB_FLAGS_JSON: '{"terminal-basics:first-terminal":"cyberbox-flag","investigate-files:log-terminal":"cyberbox-flag"}'

      SESSION_SECRET: "${SESSION_SECRET:?Set SESSION_SECRET in .env}"
      RONAK_PASSWORD_HASH: "${RONAK_PASSWORD_HASH:?Set RONAK_PASSWORD_HASH in .env}"
      ADMIN_PASSWORD_HASH: "${ADMIN_PASSWORD_HASH:?Set ADMIN_PASSWORD_HASH in .env}"
      NEXT_PUBLIC_LAB_ACCESS_CODE: "${NEXT_PUBLIC_LAB_ACCESS_CODE:?Set NEXT_PUBLIC_LAB_ACCESS_CODE in .env}"
    volumes:
      - cyberbox-data:/app/data
    networks:
      - edge

  gateway:
    <<: *runtime
    build:
      context: .
      target: gateway
    read_only: true
    mem_limit: 192m
    memswap_limit: 192m
    pids_limit: 128
    oom_score_adj: -300
    # Allow the node user to access the Docker socket (GID 109 = docker group on host)
    group_add:
      - "109"
    tmpfs:
      - /tmp:size=16m,mode=1777,nosuid,nodev
    expose:
      - "3001"
      - "3002"
    environment:
      # Shared secret for the web -> gateway internal API (at least 16 characters).
      GRADER_INTERNAL_TOKEN: ${GRADER_INTERNAL_TOKEN:?Set GRADER_INTERNAL_TOKEN in .env}
      GRADER_PORT: "3002"
      SITE_ORIGIN: "https://${SITE_DOMAIN:?Set SITE_DOMAIN in .env}"
      GATEWAY_PORT: "3001"
      GATEWAY_BIND_HOST: "0.0.0.0"
      WEB_INTERNAL_ORIGIN: "http://web:3000"
      LAB_ACCESS_HASH: "${LAB_ACCESS_HASH:?Set LAB_ACCESS_HASH in .env}"
      # At most 2 lab sessions at once, and their machines together may use at
      # most this much memory. Each session's containers run as siblings via
      # the Docker socket, not inside this container's mem_limit.
      MAX_RUNNING_LABS: "2"
      LAB_MEMORY_BUDGET_MB: "384"
      DOCKER_SOCKET: /var/run/docker.sock
      COMPOSE_PROJECT: cipher-lab
    volumes:
      # Docker socket for on-demand image builds and lab containers.
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
    sysctls:
      net.ipv4.ip_forward: "0"
    networks:
      - edge

  proxy:
    <<: *runtime
    image: caddy:2-alpine
    dns:
      - 8.8.8.8
      - 1.1.1.1
    read_only: true
    mem_limit: 128m
    memswap_limit: 128m
    pids_limit: 128
    oom_score_adj: -200
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: "${SITE_DOMAIN:?Set SITE_DOMAIN in .env}"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    tmpfs:
      - /tmp:size=16m,mode=1777,nosuid,nodev
    networks:
      - edge
    depends_on:
      - web
      - gateway

networks:
  edge:
    driver: bridge

volumes:
  cyberbox-data:
  caddy_data:
  caddy_config:
