name: cipher-lab
x-runtime: &runtime
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: "5m"
      max-file: "2"
services:
  web:
    <<: *runtime
    build:
      context: .
      target: web
    mem_limit: 512m
    pids_limit: 128
    environment:
      SESSION_SECRET: "${SESSION_SECRET:?Set SESSION_SECRET in .env}"
      RONAK_PASSWORD_HASH: "${RONAK_PASSWORD_HASH:?Set RONAK_PASSWORD_HASH in .env}"
    networks:
      - edge
  gateway:
    <<: *runtime
    build:
      context: .
      target: gateway
    read_only: true
    mem_limit: 256m
    pids_limit: 128
    tmpfs:
      - /tmp:size=16m,mode=1777,nosuid,nodev
    environment:
      SITE_ORIGIN: "https://${SITE_DOMAIN:?Set SITE_DOMAIN in .env}"
      GATEWAY_PORT: "3001"
      GATEWAY_BIND_HOST: "0.0.0.0"
      LAB_ACCESS_HASH: "${LAB_ACCESS_HASH:?Set LAB_ACCESS_HASH in .env}"
      LINUX_HOST: linux-basics
      LINUX_PORT: "2222"
      LINUX_USER: Ronak
      LINUX_KEY_FILE: /run/keys/lab_ed25519
      LINUX_KEY_PASSPHRASE: "${LINUX_KEY_PASSPHRASE:-}"
      LINUX_HOST_FINGERPRINT: "${LINUX_HOST_FINGERPRINT:?Set the lab fingerprint}"
    volumes:
      - type: bind
        source: ./.secrets/lab_ed25519
        target: /run/keys/lab_ed25519
        read_only: true
        bind:
          create_host_path: false
    sysctls:
      net.ipv4.ip_forward: "0"
    networks:
      - edge
      - practice
    depends_on:
      linux-basics:
        condition: service_healthy
  linux-basics:
    <<: *runtime
    build:
      context: ./lab
    hostname: practice-box
    read_only: true
    cpus: 0.50
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 96
    shm_size: 8m
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - SYS_CHROOT
      - KILL
      - AUDIT_WRITE
    tmpfs:
      - /run:size=8m,mode=0755,nosuid,nodev
      - /tmp:size=32m,mode=1777,nosuid,nodev
      - /home/Ronak:size=64m,mode=0700,uid=1000,gid=1000,nosuid,nodev
    volumes:
      - type: bind
        source: ./.secrets/lab_ed25519.pub
        target: /etc/ssh/authorized_keys/Ronak
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./.secrets/ssh_host_ed25519
        target: /run/keys/ssh_host_ed25519
        read_only: true
        bind:
          create_host_path: false
    dns:
      - 127.0.0.1
    networks:
      - practice
    healthcheck:
      test:
        - CMD-SHELL
        - test -s /run/sshd.pid && /usr/sbin/sshd -t
      interval: 10s
      timeout: 3s
      retries: 5
  proxy:
    <<: *runtime
    image: caddy:2-alpine
    dns:
      - 8.8.8.8
      - 1.1.1.1
    read_only: true
    mem_limit: 256m
    pids_limit: 128
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: "${SITE_DOMAIN:?Set SITE_DOMAIN in .env}"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    tmpfs:
      - /tmp:size=16m,mode=1777,nosuid,nodev
    networks:
      - edge
    depends_on:
      - web
      - gateway
networks:
  edge:
    driver: bridge
  practice:
    driver: bridge
    internal: true
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
volumes:
  caddy_data:
  caddy_config:
